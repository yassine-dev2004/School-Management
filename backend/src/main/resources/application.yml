spring:
  application:
    name: management
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://ep-wild-band-axp9e22a.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:neondb_owner}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:npg_rEl0TjnhDw7M}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

server:
  port: ${PORT:8085}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: 86400000 # 24 hours

