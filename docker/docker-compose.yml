version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: school_management_db
    environment:
      POSTGRES_USER: school_admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: school_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
